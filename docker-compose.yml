services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentry_ai_explainer
      POSTGRES_USER: sentry
      POSTGRES_PASSWORD: sentry
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentry -d sentry_ai_explainer"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://sentry:sentry@postgres:5432/sentry_ai_explainer
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8881:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://sentry:sentry@postgres:5432/sentry_ai_explainer
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DEBUG: "false"
      ALLOWED_ORIGINS: http://localhost:3001
      SECRET_KEY: ${SECRET_KEY:-change-me-before-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APP_SENTRY_DSN: ${APP_SENTRY_DSN:-}
      SENTRY_API_TOKEN: ${SENTRY_API_TOKEN:-}
      SENTRY_ORG_SLUG: ${SENTRY_ORG_SLUG:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8881/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
